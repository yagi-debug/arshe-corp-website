<script>
(async function () {
  var msg = document.getElementById("msg");
  function fail() { msg.hidden = false; }
  function bytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  try {
    var k = new URLSearchParams(location.search).get("k");
    if (!k || !/^[A-Za-z0-9_-]{43}$/.test(k) || !window.crypto || !crypto.subtle) return fail();
    var key = await crypto.subtle.importKey("raw", bytes(k), "AES-GCM", false, ["decrypt"]);
    var data = bytes(document.getElementById("payload").textContent.trim());
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
    var doc = new DOMParser().parseFromString(new TextDecoder().decode(plain), "text/html");
    var hash = location.hash;
    // 復号した文書で html 要素ごと置き換える（document.write は環境によって追記になるので使わない）
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
    // DOMParser で作った script は差し込んでも動かないので、作り直して動かす（コメント欄の読み書き）
    document.querySelectorAll("script").forEach(function (old) {
      var s = document.createElement("script");
      for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    if (hash) {
      // 書き込んだ後の文書で :target を効かせるため、#以降を付け直す
      history.replaceState(null, "", location.pathname + location.search);
      location.hash = hash;
    }
  } catch (err) {
    fail();
  }
})();
</script>
